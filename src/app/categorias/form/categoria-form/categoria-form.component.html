
  
  <div class="card bg-secondary  text-white"  >
    <div class="card-header"> {{titulo}} </div>
      <div class="card-body">
  
  <form #form="ngForm">
  
    <div class="form-group row">
      <label for="nombreCategoria" class="col-form-label col-sm-2" >Nombre categoria:</label>
        <div class="col-sm-6">
            <input type="text"class="form-control" [(ngModel)]="categoria.nombreCategoria" name="nombreCategoria" required minlength="4" #nombre="ngModel">
            <div class="alert alert-danger" *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" >
              <div *ngIf="nombre.errors.required">
                  Nombre es requerido.
              </div>
              <div *ngIf="nombre.errors.minlength">
                  Nombre debe tener al menos 4 caracteres.
              </div>
            </div>
        </div>
    </div>
    <div class="form-group row">
      <div class="col-sm-6">
        <button role="button" [disabled]="!form.form.valid"  class="btn btn-primary mr-3"  name="button" (click)="create()" *ngIf="!categoria.idCategoria else elseBlock" >Crear</button>  
      <ng-template #elseBlock>
        <button role="button"[disabled]="!form.form.valid"   class="btn btn-primary mr-3"  name="button" (click)="update()"  >Actualizar</button>  
      </ng-template>
      <button role="button" [routerLink]="['/categorias']"  class="btn btn-danger"  name="button"  >Cancelar</button>  

      </div>
    </div>
  
  </form>
  
      </div>
  </div>
