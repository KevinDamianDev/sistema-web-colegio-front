<br>
<div class="container">
  <div class="card  border-primary  mb-3">
    <div class="card-header">CATEGORIAS</div>
    <div class="card-body" >

      <div class="my-2 text-left">
        <button type="button" [routerLink]="['/categorias/form']" class="btn btn-rounded btn-primary" >Crear Categoria</button>
      </div>
      <div class="table-responsive">
        <div *ngIf="categorias?.length==0" class="alert alert-info">
          No hay registros en la base de datos!
        </div>
        <!-- Agregar esto encima de la tabla -->
        <div class="row" *ngIf="categorias?.length > 0">
          <div class="col-md-6">
            <div class="input-group mb-3">
              <input type="text" class="form-control" placeholder="Buscar categoría..." [(ngModel)]="searchTerm" (input)="search()">
            </div>
            
          </div>
        </div>
        

        <table class="table table-striped table-bordered" *ngIf="paginatedCategorias?.length > 0">
          <thead>
          <tr>
            <th>ID</th>
            <th>NOMBRE CATEGORIA</th>
            <th>Editar</th>
            <th>Eliminar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let categoria of paginatedCategorias" >
            <td>{{categoria.idCategoria}}</td>
              <td>{{categoria.nombreCategoria}}</td>
              <td>
                <button type="button" name="editar" [routerLink]="['/categorias/form',categoria.idCategoria]"
                class="btn btn-primary" >Editar</button>
              </td>
              <td>
                <button type="button" name="eliminar" (click)="delete(categoria)"
                class="btn btn-danger" >Eliminar</button>
              </td>             

          </tr>
        </tbody>
    
      </table>
      <!-- ... el resto de tu plantilla ... -->

<!-- Agregar la paginación justo debajo de la tabla -->
<!-- Paginación -->
<nav aria-label="Page navigation example">
  <ul class="pagination">
    <li class="page-item" [class.disabled]="currentPage === 1">
      <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage - 1)" aria-label="Previous">
        <span aria-hidden="true">&laquo;</span>
      </a>
    </li>
    <li class="page-item" *ngFor="let page of [].constructor(ceil(categorias.length / itemsPerPage)); let i = index" [class.active]="currentPage === i + 1">
      <a class="page-link" href="javascript:void(0);" (click)="changePage(i + 1)">{{ i + 1 }}</a>
    </li>
    <li class="page-item" [class.disabled]="currentPage === ceil(categorias.length / itemsPerPage)">
      <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage + 1)" aria-label="Next">
        <span aria-hidden="true">&raquo;</span>
      </a>
    </li>
  </ul>
</nav>


      </div>

    </div>
</div> 
</div>
