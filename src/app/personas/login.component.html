<div class="login-container">
    <div class="login-form">
      <h2 class="text-center">Iniciar sesión</h2>
      <form method="post">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input [(ngModel)]="persona.usuarioPersona" type="usuario" id="usuario" name="usuario" placeholder="Usuario" 
          class="form-control" autofocus required >
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input [(ngModel)]="persona.passwordPersona" type="password" id="password" name="password" placeholder="Contraseña" 
          class="form-control" autofocus required>
        </div>
        <input type="submit" (click)="login()" class="btn btn-primary btn-block" value="Iniciar sesion" >
      </form>
    </div>
  </div>
