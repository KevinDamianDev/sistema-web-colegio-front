<br>
<div class="container" *ngIf="auth.hasRole('ROLE_ADMIN')">
  <div class="card bg-secondary text-white" style="max-width: 100%; margin: auto; padding: 20px;">
    <div class="card-header text-center font-weight-bold">{{titulo}}</div>
    <div class="card-body">

      <form #form="ngForm">

        <div class="form-group row">
          <label for="nombrePersona" class="col-form-label col-sm-3">Nombres:</label>
          <div class="col-sm-8">
            <input type="text" class="form-control" [(ngModel)]="persona.nombrePersona" name="nombrePersona" required minlength="4" #nombre="ngModel">
            <div class="alert alert-danger mt-2" *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)">
              <div *ngIf="nombre.errors.required">Nombre es requerido.</div>
              <div *ngIf="nombre.errors.minlength">Nombre debe tener al menos 4 caracteres.</div>
            </div>
          </div>
        </div>

        <div class="form-group row">
          <label for="apellidosPersona" class="col-form-label col-sm-3">Apellido:</label>
          <div class="col-sm-8">
            <input type="text" class="form-control" [(ngModel)]="persona.apellidosPersonas" name="apellidosPersona" required #apellido="ngModel">
            <div class="alert alert-danger mt-2" *ngIf="apellido.invalid && (apellido.dirty || apellido.touched)">
              <div *ngIf="apellido.errors.required">Apellido es requerido.</div>
            </div>
          </div>
        </div>

        <div class="form-group row">
          <label for="correoPersona" class="col-form-label col-sm-3">Email:</label>
          <div class="col-sm-8">
            <input type="email" class="form-control" [(ngModel)]="persona.correoPersona" name="correoPersona" required #email="ngModel">
            <div class="alert alert-danger mt-2" *ngIf="email.invalid && (email.dirty || email.touched)">
              <div *ngIf="email.errors.required">Email es requerido.</div>
              <div *ngIf="email.errors.email">Email debe tener un formato válido.</div>
            </div>
          </div>
        </div>

        <div class="form-group row">
          <label for="dniPersona" class="col-form-label col-sm-3">DNI:</label>
          <div class="col-sm-8">
            <input type="number" class="form-control" [(ngModel)]="persona.dniPersona" name="dniPersona" required #dni="ngModel">
            <div class="alert alert-danger mt-2" *ngIf="dni.invalid && (dni.dirty || dni.touched)">
              <div *ngIf="dni.errors.required">DNI es requerido.</div>
            </div>
          </div>
        </div>
        <div class="form-group row">
          <label for="telefonoPersona" class="col-form-label col-sm-3">Teléfono:</label>
          <div class="col-sm-8">
            <input type="number" class="form-control" [(ngModel)]="persona.telefonoPersona" name="telefonoPersona" required #telefonoP="ngModel">
            <div class="alert alert-danger mt-2" *ngIf="telefonoP.invalid && (telefonoP.dirty || telefonoP.touched)">
              <div *ngIf="telefonoP.errors.required">Teléfono es requerido.</div>
            </div>
          </div>
        </div>
        <div class="form-group row">
          <label for="fechaNacPersona" class="col-form-label col-sm-3">Fecha Nacimiento:</label>
          <div class="col-sm-8">
            <input type="date" class="form-control" [(ngModel)]="persona.fechaNacPersona" name="fechaNacPersona" required #fecha="ngModel">
            <div class="alert alert-danger mt-2" *ngIf="fecha.invalid && (fecha.dirty || fecha.touched)">
              <div *ngIf="fecha.errors.required">Fecha es requerida.</div>
            </div>
          </div>
        </div>

        <div class="form-group row">
          <label for="estadoPersona" class="col-form-label col-sm-3">Estado:</label>
          <div class="col-sm-8">
            <select class="form-control" [(ngModel)]="persona.estadoPersona" name="estadoPersona" required #estado="ngModel">
              <option [ngValue]="true">Activo</option>
              <option [ngValue]="false">Inactivo</option>
            </select>
            <div class="alert alert-danger mt-2" *ngIf="estado.invalid && (estado.dirty || estado.touched)">
              <div *ngIf="estado.errors.required">Estado es requerido.</div>
            </div>
          </div>
        </div>

        <div class="form-group row">
          <label for="usuarioPersona" class="col-form-label col-sm-3">Usuario:</label>
          <div class="col-sm-8">
            <input type="text" class="form-control" [(ngModel)]="persona.usuarioPersona" name="usuarioPersona" required #usuario="ngModel">
            <div class="alert alert-danger mt-2" *ngIf="usuario.invalid && (usuario.dirty || usuario.touched)">
              <div *ngIf="usuario.errors.required">Usuario es requerido.</div>
            </div>
          </div>
        </div>

        <div class="form-group row">
          <label for="passwordPersona" class="col-form-label col-sm-3">Password:</label>
          <div class="col-sm-8">
            <input type="password" class="form-control" [(ngModel)]="persona.passwordPersona" name="passwordPersona" required #pass="ngModel">
            <div class="alert alert-danger mt-2" *ngIf="pass.invalid && (pass.dirty || pass.touched)">
              <div *ngIf="pass.errors.required">Password es requerido.</div>
            </div>
          </div>
        </div>

        <div class="form-group row">
          <label for="roles" class="col-form-label col-sm-3">Rol:</label>
          <div class="col-sm-8">
            <div *ngFor="let rol of roles; let i = index">
              <label style="display: flex; align-items: center;">
                <input type="checkbox" [name]="'roles_' + i" [ngModel]="persona.rolesSeleccionados.includes(rol.idRol)"
                  (ngModelChange)="toggleRol(rol.idRol)" style="margin-right: 5px; cursor: pointer;">
                {{ rol.nombreRoles }}
              </label>
            </div>
          </div>
        </div>

        <div class="form-group row text-center">
          <div class="col-sm-12">
            <button role="button" [disabled]="!form.form.valid" class="btn btn-primary mr-3" name="button" (click)="create()"
              *ngIf="!persona.idPersona else elseBlock">Crear</button>
            <ng-template #elseBlock>
              <button role="button" [disabled]="!form.form.valid" class="btn btn-primary mr-3" name="button"
                (click)="update()">Actualizar</button>
            </ng-template>
            <button role="button" [routerLink]="['/personas']" class="btn btn-danger" name="button">Cancelar</button>
          </div>
        </div>

      </form>

    </div>
  </div>
</div>
