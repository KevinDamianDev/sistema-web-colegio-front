
  
  <div class="card bg-secondary  text-white"  >
    <div class="card-header"> {{titulo}} </div>
      <div class="card-body">
  
  <form #form="ngForm">
  
    <div class="form-group row">
      <label for="nombrePersona" class="col-form-label col-sm-2" >Nombres:</label>
        <div class="col-sm-6">
            <input type="text"class="form-control" [(ngModel)]="persona.nombrePersona" name="nombrePersona" required minlength="4" #nombre="ngModel">
            <div class="alert alert-danger" *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" >
              <div *ngIf="nombre.errors.required">
                  Nombre es requerido.
              </div>
              <div *ngIf="nombre.errors.minlength">
                  Nombre debe tener al menos 4 caracteres.
              </div>
            </div>
        </div>
    </div>

    <div class="form-group row">
        <label for="apellidosPersona" class="col-form-label col-sm-2" >Apellido:</label>
        <div class="col-sm-6">
          <input type="text"class="form-control" [(ngModel)]="persona.apellidosPersonas" name="apellidosPersona" required #apellido="ngModel">
          <div class="alert alert-danger" *ngIf="apellido.invalid && (apellido.dirty || apellido.touched)" >
            <div *ngIf="apellido.errors.required">
                Apellido es requerido.
            </div>
          </div>
        </div>
    </div>
    <div class="form-group row">
        <label for="correoPersona" class="col-form-label col-sm-2" >Email:</label>
        <div class="col-sm-6">
          <input type="text"class="form-control" [(ngModel)]="persona.correoPersona" name="correoPersona" required email #email="ngModel">
          <div class="alert alert-danger" *ngIf="email.invalid && (email.dirty || email.touched)" >
            <div *ngIf="email.errors.required">
                Email es requerido.
            </div>
            <div *ngIf="email.errors.email">
              Email debe tener un formato válido.
          </div>
          </div>
        </div>
    </div>
    <div class="form-group row">
        <label for="dniPersona" class="col-form-label col-sm-2" >Dni:</label>
        <div class="col-sm-6">
          <input type="number"class="form-control" [(ngModel)]="persona.dniPersona" name="dniPersona" required #dni="ngModel">
          <div class="alert alert-danger" *ngIf="dni.invalid && (dni.dirty || dni.touched)" >
            <div *ngIf="dni.errors.required">
                DNI es requerido.
            </div>
          </div>
        </div>
    </div>
    <div class="form-group row">
        <label for="fechaNacPersona" class="col-form-label col-sm-2" >Fecha N.</label>
        <div class="col-sm-6">
          <input type="date"class="form-control" [(ngModel)]="persona.fechaNacPersona" name="fechaNacPersona" required #fecha="ngModel">
          <div class="alert alert-danger" *ngIf="fecha.invalid && (fecha.dirty || fecha.touched)" >
            <div *ngIf="fecha.errors.required">
                Fecha es requerido.
            </div>
          </div>
        </div>
    </div>
  <!--  <div class="form-group row">
        <label for="estadoPersona" class="col-form-label col-sm-2" >Estado</label>
        <div class="col-sm-6">
          <input type="text"class="form-control" [(ngModel)]="persona.estadoPersona" name="estadoPersona" required #estado="ngModel" >
          <div class="alert alert-danger" *ngIf="estado.invalid && (estado.dirty || estado.touched)" >
            <div *ngIf="estado.errors.required">
              Estado es requerido.
            </div>
          </div>
        </div>
    </div>
  -->
  <div class="form-group row">
    <label for="estadoPersona" class="col-form-label col-sm-2">Estado</label>
    <div class="col-sm-6">
      <select class="form-control" [(ngModel)]="persona.estadoPersona" name="estadoPersona" required #estado="ngModel">
        <option [ngValue]="true">Activo</option>
        <option [ngValue]="false">Inactivo</option>
      </select>
      <div class="alert alert-danger" *ngIf="estado.invalid && (estado.dirty || estado.touched)">
        <div *ngIf="estado.errors.required">
          Estado es requerido.
        </div>
      </div>
    </div>
  </div>
  
    <div class="form-group row">
        <label for="usuarioPersona" class="col-form-label col-sm-2" >Usuario</label>
        <div class="col-sm-6">
          <input type="text"class="form-control" [(ngModel)]="persona.usuarioPersona" name="usuarioPersona" required #usuario="ngModel" >
          <div class="alert alert-danger" *ngIf="usuario.invalid && (usuario.dirty || usuario.touched)" >
            <div *ngIf="usuario.errors.required">
              Usuario es requerido.
            </div>
          </div>
        </div>
    </div>
    <div class="form-group row">
      <label for="passwordPersona" class="col-form-label col-sm-2" >Password</label>
      <div class="col-sm-6">
        <input type="text"class="form-control" [(ngModel)]="persona.passwordPersona" name="passwordPersona" required #pass="ngModel" >
        <div class="alert alert-danger" *ngIf="pass.invalid && (pass.dirty || pass.touched)" >
          <div *ngIf="pass.errors.required">
            Password es requerido.
          </div>
        </div>
      </div>
  </div>
  
   
  
    <div class="form-group row">
      <div class="col-sm-6">
        <button role="button" [disabled]="!form.form.valid"  class="btn btn-primary mr-3"  name="button" (click)="create()" *ngIf="!persona.idPersona else elseBlock" >Crear</button>  
      <ng-template #elseBlock>
        <button role="button"[disabled]="!form.form.valid"   class="btn btn-primary  mr-3"  name="button" (click)="update()"  >Actualizar</button>  
      </ng-template>
      <button role="button" [routerLink]="['/personas']"  class="btn btn-danger"  name="button"  >Cancelar</button>  
      </div>
    </div>
  
  </form>
  
      </div>
  </div>
