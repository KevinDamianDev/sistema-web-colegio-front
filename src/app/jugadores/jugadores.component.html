<app-detalle-jugador *ngIf="jugadorSeleccionado" [jugador]="jugadorSeleccionado" ></app-detalle-jugador>

<div class="card  border-primary  mb-3">
    <div class="card-header">JUGADORES</div>
    <div class="card-body text-success" >

      <div class="my-2 text-left">
        <button type="button" [routerLink]="['/jugadores/form']" class="btn btn-rounded btn-primary" >Crear Jugador</button>
      </div>
      <div class="table-responsive">
        <div *ngIf="jugadores?.length==0" class="alert alert-info">
          No hay registros en la base de datos!
        </div>
      <table class="table" *ngIf="jugadores?.length>0" >
        <thead>
          <tr>
            <th>Foto</th>
            <th>Nombre</th>
            <th>Dni</th>
            <th>Fecha N.</th>
            <th>Dorsal</th>
            <th>Editar</th>
            <th>Eliminar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let jugador of jugadores" >
            <td> <img (click)="abrirModal(jugador)" *ngIf="jugador?.foto" src="http://localhost:8080/jugadores/uploads/img/{{jugador.foto}}" alt="{{jugador.foto}}" class="img-thumbnail rounded" 
              style="width: 80px; cursor: pointer;" >
              <img (click)="abrirModal(jugador)" *ngIf="!jugador?.foto" src="http://localhost:8080/images/no_jugador.png" alt="Sin foto" class="img-thumbnail rounded" 
              style="width: 80px; cursor: pointer;" >
            </td>
              <td>{{jugador.nombreJugador}}</td>
              <td>{{jugador.dni}}</td>
              <td>{{jugador.fechaNJugador  | date:"EEEE dd, MMM yyyy"}}</td>
              <td>{{jugador.dorsalJugador}}</td>
              <td>
                <button type="button" name="editar" [routerLink]="['/jugadores/form',jugador.idJugador]"
                class="btn btn-primary" >Editar</button>
              </td>
              <td>
                <button type="button" name="eliminar" (click)="delete(jugador)"
                class="btn btn-danger" >Eliminar</button>
              </td>
          </tr>
        </tbody>
    
      </table>
      </div>

    </div>
</div>
