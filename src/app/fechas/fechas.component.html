<div class="card  border-primary  mb-3">
    <div class="card-header">FECHAS</div>
    <div class="card-body text-success" >

      <div class="my-2 text-left">
        <button type="button" [routerLink]="['/fechas/form']" class="btn btn-rounded btn-primary" >Crear Fecha</button>
      </div>
      <div class="table-responsive">
        <div *ngIf="fechas?.length==0" class="alert alert-info">
          No hay registros en la base de datos!
        </div>
      <table class="table" *ngIf="fechas?.length>0" >
        <thead>
          <tr>
            <th>ID</th>
            <th>NOMBRE FECHA</th>
            <th>FASE</th>
            <th>Editar</th>
            <th>Eliminar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let fecha of fechas" >
            <td>{{fecha.idFecha}}</td>
              <td>{{fecha.nombreFecha}}</td>
              <td>{{fecha.fase.nombreFase}}</td>
              <td>
                <button type="button" name="editar" [routerLink]="['/fechas/form',fecha.idFecha]"
                class="btn btn-primary" >Editar</button>
              </td>
              <td>
                <button type="button" name="eliminar" (click)="delete(fecha)"
                class="btn btn-danger" >Eliminar</button>
              </td>
          </tr>
        </tbody>   
      </table>
      </div>
    </div>
</div>
