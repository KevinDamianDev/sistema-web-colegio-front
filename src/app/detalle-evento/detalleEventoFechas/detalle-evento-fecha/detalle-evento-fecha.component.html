
<div class="container">
  <div class="row">
    <div class="col-md-12">
      <hr style="border-top: 2px solid #000000; margin: 10px 0;"> <!-- Línea horizontal con estilo inline (rojo) -->
      <div class="d-flex align-items-center">
        <i class="fa fa-arrow-left" [routerLink]="['/detalle/evento',idEvento]" style="cursor: pointer;"></i>
        <h5 style="font-size: 15px; margin-left: 20px;">Detalle del evento</h5> <!-- Texto "Detalle de evento" más grande con margen izquierdo -->
      </div>
      <hr style="border-top: 2px solid #000000; margin: 5px 0;"> <!-- Otra línea horizontal con estilo inline (rojo) -->
    </div>
  </div>
   <div class="row">
      <div class="col-md-12">
        <div class="alert alert-primary" style="text-align: center; display: flex; justify-content: center; align-items: center;">
            {{fase.nombreFase}}
          </div>
      </div>
    </div>
  </div>

  
  <div class="container">
    <div class="row">
        <div class="col-md-6">
            <h5>Fechas de la fase</h5>
            <div class="row">
              <div class="my-2 text-left" *ngIf="auth.hasRole('ROLE_ADMIN') || auth.hasRole('ROLE_USER')">
                <input type="checkbox" [(ngModel)]="checkboxSeleccionado" (change)="toggleBotones()"> Opciones
              </div>
              <div class="col-md-6">
                <div class="my-2 text-left" *ngIf="botonesHabilitados">
                  <button type="button" [routerLink]="['/fechas/form',{ idFase: fase.idFase}]" 
                  class="btn btn-rounded btn-primary">Crear Fechas</button>
                </div>
              </div>
            <!--  <div class="col-md-8" *ngIf="!errores" >

              </div>-->
            </div>

          <div class="row" *ngIf="!errores">
              <div class="col-md-12" *ngFor="let fecha of fechas">
                <div  class="card mb-3">
                  <div class="card-body d-flex justify-content-center" >
                    <h5 class="card-title"> </h5>
                   
                    <a [routerLink]="['/dueloFecha', { idFase: fase.idFase, idFecha: fecha.idFecha }]"> {{fecha.nombreFecha}}</a>
                  </div>
                  <div class="d-flex justify-content-center">
                    <button *ngIf="botonesHabilitados" type="button" [routerLink]="['/fechas/form', fecha.idFecha,{ idFase: fase.idFase }]" name="editar"  class="btn btn-primary mr-2 mb-3">
                      <i class="fas fa-edit"></i>
                    </button>
                    <button *ngIf="botonesHabilitados" type="button" name="eliminarFase"  (click)="deleteFecha(fecha)"  class="btn btn-danger mb-3">
                      <i class="fas fa-trash-alt"></i>
                    </button>
                  </div>        
                  </div>
                </div>
            </div>

            <div *ngIf="errores">
              <div class="alert alert-info">
                  No hay fechas para la fase.
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <h5>Grupos de la fase</h5>

          <div class="row">
            <div class="my-2 text-left" *ngIf="auth.hasRole('ROLE_ADMIN') || auth.hasRole('ROLE_USER')">
              <input type="checkbox" [(ngModel)]="checkboxSeleccionadoGrupo" (change)="toggleBotonesGrupo()"> Opciones
            </div>
            <div class="col-md-5">
              <div class="my-2 text-left" *ngIf="botonesHabilitadosGrupo">
                <button type="button" [routerLink]="['/grupos/form',{ idFase: fase.idFase}]" 
                class="btn btn-rounded btn-primary">Crear Grupo</button>
              </div>
            </div>
            <div class="col-md-6" *ngIf="botonesHabilitadosGrupo">
              <div class="my-2 text-left">
                <button type="button" [routerLink]="['/asignarEquipoGrupo',{ idEvento: idEvento, idFase: fase.idFase }]"
                 class="btn btn-rounded btn-success">Asignar</button>
              </div>
            </div>
            
           
            
          </div>   

            <div class="row" *ngIf="!erroresGrupo">
                <div class="col-md-12" *ngFor="let grupo of grupos">
                  <div  class="card mb-3">
                    <div class="card-body d-flex justify-content-center" >
                      <h5 class="card-title"> </h5>
                      <a [routerLink]="['/equiposGrupo', { idFase: fase.idFase, idGrupo: grupo.idGrupo }]"> {{grupo.nombreGrupo}}</a>
                    </div>
                      <div class="d-flex justify-content-center">
                        <button *ngIf="botonesHabilitadosGrupo" type="button" [routerLink]="['/grupos/form', grupo.idGrupo,{ idFase: fase.idFase }]" name="editar"  class="btn btn-primary mr-2 mb-3">
                          <i class="fas fa-edit"></i>
                        </button>
                        <button *ngIf="botonesHabilitadosGrupo" type="button" name="eliminarGrupo"  (click)="deleteGrupo(grupo)"  class="btn btn-danger mb-3">
                          <i class="fas fa-trash-alt"></i>
                        </button>
                      </div>        
                    </div>
                  </div>
            </div>

              <div *ngIf="erroresGrupo">
                <div class="alert alert-info">
                    No hay grupos para la fase.
                  </div>
              </div>
        </div>
    </div>
  </div>
