<div class="card bg-secondary  text-white"  >
  <div class="card-header" > {{titulo}} - {{nombreEvento}} </div>
    <div class="card-body">
<form #form="ngForm"> 
  <div class="form-group row">
    <label for="nombreFase" class="col-form-label col-sm-2" >Nombre Fase:</label>
      <div class="col-sm-6">
          <input type="text"class="form-control" [(ngModel)]="faseEvento.nombreFase" name="nombreFase" required minlength="4" #nombre="ngModel">
          <div class="alert alert-danger" *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" >
            <div *ngIf="nombre.errors.required">
                Nombre de fase es requerido.
            </div>
            <div *ngIf="nombre.errors.minlength">
                Nombre de fase debe tener al menos 4 caracteres.
            </div>
          </div>
      </div>
  </div>
  <div class="form-group row">
    <label for="nombreEvento" class="col-form-label col-sm-2" >Evento:</label>
      <div class="col-sm-6">
        <label  class="form-control">{{nombreEvento}}</label> 
      </div>
               
  </div>


  <div class="form-group row">
    <div class="col-sm-6">
      <button role="button" [disabled]="!form.form.valid"  class="btn btn-primary mr-3"  name="button" (click)="createFaseByEvento()" *ngIf="!fase.idFase else elseBlock" >Crear</button>  
    <ng-template #elseBlock>
      <button role="button"[disabled]="!form.form.valid"   class="btn btn-primary mr-3"  name="button" (click)="update()"  >Actualizar</button>  
    </ng-template>
    <button role="button"  class="btn btn-danger"  (click)="cancelar()" name="button"  >Cancelar</button>  
    </div>
  </div> 
</form>  
</div>
</div>
