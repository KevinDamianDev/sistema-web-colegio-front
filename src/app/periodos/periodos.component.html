<br>
<div class="container-fluid">
    <div class="card border-primary mb-3" style="max-width: 80%; margin: auto;">
        <div class="card-header text-center font-weight-bold">PERIOOS</div>
        <div class="card-body">

            <div class="my-2 text-left">
                <button type="button" [routerLink]="['/periodos/form']" class="btn btn-rounded btn-primary">
                    Crear Periodo
                </button>
            </div>

            <div class="table-responsive w-100">
                <div *ngIf="periodos?.length==0" class="alert alert-info">
                    No hay registros en la base de datos!
                </div>

                <div class="row" *ngIf="periodos?.length > 0">
                    <div class="col-md-6">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="Buscar por periodo..."
                                [(ngModel)]="searchTerm" (input)="search()">
                        </div>
                    </div>
                </div>
                <table class="table table-striped table-bordered w-100" *ngIf="periodos?.length > 0">
                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Periodo</th>
                            <th>Estado</th>
                            <th>#</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let periodo of paginatedPeriodos">
                            <td>{{periodo.idPeriodo}}</td>
                            <td>{{periodo.nombrePeriodo}}</td>
                            <td>{{periodo.estadoPeriodo === true ? 'Activo' : 'Inactivo'}}</td>

                            <td>
                                <button type="button" name="editar" [routerLink]="['/periodos/form', periodo.idPeriodo]"
                                    class="btn btn-primary" title="Editar periodo">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button type="button" name="eliminar" (click)="delete(periodo)" class="btn btn-danger"
                                    title="Eliminar periodo">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <nav aria-label="Page navigation example">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" [class.disabled]="currentPage === 1">
                            <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage - 1)"
                                aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item"
                            *ngFor="let page of [].constructor(ceil(periodos.length / itemsPerPage)); let i = index"
                            [class.active]="currentPage === i + 1">
                            <a class="page-link" href="javascript:void(0);" (click)="changePage(i + 1)">{{ i + 1 }}</a>
                        </li>
                        <li class="page-item" [class.disabled]="currentPage === ceil(periodos.length / itemsPerPage)">
                            <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage + 1)"
                                aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
