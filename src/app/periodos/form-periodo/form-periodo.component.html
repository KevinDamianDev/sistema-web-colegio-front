<br>
<div class="container" *ngIf="auth.hasRole('ROLE_ADMIN')">
  <div class="card bg-secondary text-white" style="max-width: 100%; margin: auto; padding: 20px;">
    <div class="card-header text-center font-weight-bold">{{titulo}}</div>
    <div class="card-body">

      <form #form="ngForm">

        <div class="form-group row">
          <label for="nombrePeriodo" class="col-form-label col-sm-3">Periodo:</label>
          <div class="col-sm-8">
            <input type="text" class="form-control" [(ngModel)]="periodo.nombrePeriodo" name="nombrePeriodo" required minlength="4" #nombre="ngModel">
            <div class="alert alert-danger mt-2" *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)">
              <div *ngIf="nombre.errors.required">Periodo es requerido.</div>
              <div *ngIf="nombre.errors.minlength">Periodo debe tener al menos 4 caracteres.</div>
            </div>
          </div>
        </div>

        <div class="form-group row">
          <label for="estadoPeriodo" class="col-form-label col-sm-3">Estado:</label>
          <div class="col-sm-8">
            <select class="form-control" [(ngModel)]="periodo.estadoPeriodo" name="estadoPeriodo" required #estado="ngModel">
              <option [ngValue]="true">Activo</option>
              <option [ngValue]="false">Inactivo</option>
            </select>
            <div class="alert alert-danger mt-2" *ngIf="estado.invalid && (estado.dirty || estado.touched)">
              <div *ngIf="estado.errors.required">Estado es requerido.</div>
            </div>
          </div>
        </div>



        <div class="form-group row text-center">
          <div class="col-sm-12">
            <button role="button" [disabled]="!form.form.valid" class="btn btn-primary mr-3" name="button" (click)="create()"
              *ngIf="!periodo.idPeriodo else elseBlock">Crear</button>
            <ng-template #elseBlock>
              <button role="button" [disabled]="!form.form.valid" class="btn btn-primary mr-3" name="button"
                (click)="update()">Actualizar</button>
            </ng-template>
            <button role="button" [routerLink]="['/periodos']" class="btn btn-danger" name="button">Cancelar</button>
          </div>
        </div>

      </form>

    </div>
  </div>
</div>
