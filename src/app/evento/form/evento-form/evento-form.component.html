
  
  <div class="card bg-secondary  text-white"  >
    <div class="card-header"> {{titulo}} </div>
      <div class="card-body">
  
  <form #form="ngForm"> 
    <div class="form-group row">
      <label for="nombreEvento" class="col-form-label col-sm-2" >Nombre Evento:</label>
        <div class="col-sm-6">
            <input type="text"class="form-control" [(ngModel)]="evento.nombreEvento" name="nombreEvento" required minlength="4" #nombre="ngModel">
            <div class="alert alert-danger" *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" >
              <div *ngIf="nombre.errors.required">
                  Nombre es requerido.
              </div>
              <div *ngIf="nombre.errors.minlength">
                  Nombre debe tener al menos 4 caracteres.
              </div>
            </div>
        </div>
    </div>

    <div class="form-group row">
        <label for="categoria" class="col-form-label col-sm-2" >Categoria:</label>
        <div class="col-sm-6">
            <select [compareWith]="compararCategoria" class="form-control" [(ngModel)]="evento.categoria" name="categoria" required #categoria="ngModel" >
              <option [ngValue]="undefined">--Seleccionar Categoria--</option>
              <option *ngFor="let categoria of categorias" [ngValue]="categoria">{{categoria.nombreCategoria}}</option>
            </select>
            <div class="alert alert-danger" *ngIf="categoria.invalid && (categoria.dirty || categoria.touched)" >
              <div *ngIf="categoria.errors.required">
                  Categoria es requerida.
              </div>
            </div>
        </div>
      </div>



    <div class="form-group row">
      <div class="col-sm-6">
        <button role="button" [disabled]="!form.form.valid"  class="btn btn-primary mr-3"  name="button" (click)="create()" *ngIf="!evento.idEvento else elseBlock" >Crear</button>  
      <ng-template #elseBlock>
        <button role="button"[disabled]="!form.form.valid"   class="btn btn-primary mr-3"  name="button" (click)="update()"  >Actualizar</button>  
      </ng-template>
      <button role="button" [routerLink]="['/eventos']"  class="btn btn-danger"  name="button"  >Cancelar</button>  
      </div>
    </div> 
  </form>  
</div>
</div>
