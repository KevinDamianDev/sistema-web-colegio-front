<br>
<div class="container" 
 >
<div class="card  border-primary  mb-3">
  <div class="card-header">EVENTOS</div>
  <div class="card-body" >

    <div class="my-2 text-left" *ngIf="auth.hasRole('ROLE_ADMIN')">
      <button type="button" [routerLink]="['/eventos/form']" class="btn btn-rounded btn-primary" >Crear Evento</button>
    </div>
    <div class="table-responsive">
      <div *ngIf="eventos?.length==0" class="alert alert-info">
        No hay registros en la base de datos!
      </div>
      <div class="row" *ngIf="eventos?.length > 0">
        <div class="col-md-6">
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Buscar evento..." [(ngModel)]="searchTerm" (input)="search()">
          </div>
          
        </div>
      </div>
    <table class="table table-striped table-bordered" *ngIf="eventos?.length>0" >
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre Evento</th>
          <th>Categria</th>

        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let evento of paginatedEventos" >
          <td>{{evento.idEvento}}</td>
            <td>{{evento.nombreEvento}}</td>
            <td>{{evento.categoria.nombreCategoria}}</td>
            <td *ngIf="auth.hasRole('ROLE_ADMIN')">
              <button type="button" name="editar" [routerLink]="['/eventos/form',evento.idEvento]"
              class="btn btn-primary" >Editar</button>
            </td>
            <td>
              <button type="button" name="detalle" [routerLink]="['/detalle/evento',evento.idEvento]"
              class="btn btn-success" >Detalles</button>
            </td>
            <td *ngIf="auth.hasRole('ROLE_ADMIN')">                
              <button type="button" name="eliminar" (click)="delete(evento)"
              class="btn btn-danger" >Eliminar</button>
            </td>
        </tr>
      </tbody>
  
    </table>
    <nav aria-label="Page navigation example">
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage - 1)" aria-label="Previous">
            <span aria-hidden="true">&laquo;</span>
          </a>
        </li>
        <li class="page-item" *ngFor="let page of [].constructor(ceil(eventos.length / itemsPerPage)); let i = index" [class.active]="currentPage === i + 1">
          <a class="page-link" href="javascript:void(0);" (click)="changePage(i + 1)">{{ i + 1 }}</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === ceil(eventos.length / itemsPerPage)">
          <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage + 1)" aria-label="Next">
            <span aria-hidden="true">&raquo;</span>
          </a>
        </li>
      </ul>
    </nav>
    </div>

  </div>
</div>
</div>
