<br>
<div class="container">
<div class="card  border-primary  mb-3">
  <div class="card-header">EVENTOS</div>
  <div class="card-body text-success" >

    <div class="my-2 text-left" *ngIf="auth.hasRole('ROLE_ADMIN')">
      <button type="button" [routerLink]="['/eventos/form']" class="btn btn-rounded btn-primary" >Crear Evento</button>
    </div>
    <div class="table-responsive">
      <div *ngIf="eventos?.length==0" class="alert alert-info">
        No hay registros en la base de datos!
      </div>
    <table class="table" *ngIf="eventos?.length>0" >
      <thead>
        <tr>
          <th>ID</th>
          <th>NOMBRE EVENTO</th>
          <th>CATEGORIA</th>

        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let evento of eventos" >
          <td>{{evento.idEvento}}</td>
            <td>{{evento.nombreEvento}}</td>
            <td>{{evento.categoria.nombreCategoria}}</td>
            <td *ngIf="auth.hasRole('ROLE_ADMIN')">
              <button type="button" name="editar" [routerLink]="['/eventos/form',evento.idEvento]"
              class="btn btn-primary" >Editar</button>
            </td>
            <td>
              <button type="button" name="detalle" [routerLink]="['/detalle/evento',evento.idEvento]"
              class="btn btn-success" >Detalles</button>
            </td>
            <td *ngIf="auth.hasRole('ROLE_ADMIN')">                
              <button type="button" name="eliminar" (click)="delete(evento)"
              class="btn btn-danger" >Eliminar</button>
            </td>
        </tr>
      </tbody>
  
    </table>
    </div>

  </div>
</div>
</div>
