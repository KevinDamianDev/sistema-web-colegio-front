<br>
<div class="container-fluid">
  <div class="card border-primary mb-3" style="max-width: 80%; margin: auto;">
    <div class="card-header text-center font-weight-bold">GRADOS</div>
    <div class="card-body">

      <div class="my-2 text-left">
        <button type="button" [routerLink]="['/grados/form']" class="btn btn-rounded btn-primary">
          Crear Grado
        </button>
      </div>

      <div class="table-responsive w-100" >
        <div *ngIf="grados?.length==0" class="alert alert-info">
          No hay registros en la base de datos!
        </div>
        <!-- Agregar esto encima de la tabla -->
        <div class="row" *ngIf="grados?.length > 0">
          <div class="col-md-6">
            <div class="input-group mb-3">
              <input type="text" class="form-control" placeholder="Buscar por grado..." [(ngModel)]="searchTerm" (input)="search()">
            </div>
            
          </div>
        </div>
        

        <table class="table table-striped table-bordered w-100" *ngIf="grados?.length > 0">
          <thead class="thead-dark">
            <tr>
              <th>ID</th>
              <th>Grado</th>
              <th>Sección</th>
              <th >#</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let grado of paginatedGrados">
              <td>{{grado.idGrado}}</td>
              <td>{{grado.nombreGrado}}</td>
              <td>{{grado.nombreSeccion}}</td>
    
              <td>
                <button type="button" name="editar" [routerLink]="['/grados/form', grado.idGrado]" class="btn btn-primary" title="Editar grado">
                  <i class="fas fa-edit"></i>
                </button>
                <button type="button" name="eliminar" (click)="delete(grado)" class="btn btn-danger" title="Eliminar grado">
                  <i class="fas fa-trash-alt"></i>
                </button>             
              </td>
            </tr>
          </tbody>
        </table>


          <nav aria-label="Page navigation example">
            <ul class="pagination justify-content-center">
              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage - 1)" aria-label="Previous">
                  <span aria-hidden="true">&laquo;</span>
                </a>
              </li>
              <li class="page-item" *ngFor="let page of [].constructor(ceil(grados.length / itemsPerPage)); let i = index" [class.active]="currentPage === i + 1">
                <a class="page-link" href="javascript:void(0);" (click)="changePage(i + 1)">{{ i + 1 }}</a>
              </li>
              <li class="page-item" [class.disabled]="currentPage === ceil(grados.length / itemsPerPage)">
                <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage + 1)" aria-label="Next">
                  <span aria-hidden="true">&raquo;</span>
                </a>
              </li>
            </ul>
          </nav>


  </div>

</div>
</div> 
</div>
