<div class="card bg-secondary  text-white"  >
    <div class="card-header"> {{titulo}} </div>
      <div class="card-body">
  <form #form="ngForm"> 
    <div class="form-group row">
      <label for="nombreDuelo" class="col-form-label col-sm-2" >Nombre Duelo:</label>
        <div class="col-sm-6">
            <input type="text"class="form-control" [(ngModel)]="duelo.nombreDuelo" name="nombreDuelo" required minlength="4" #nombre="ngModel">
            <div class="alert alert-danger" *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" >
              <div *ngIf="nombre.errors.required">
                  Nombre de duelo es requerido.
              </div>
              <div *ngIf="nombre.errors.minlength">
                  Nombre de duelo debe tener al menos 4 caracteres.
              </div>
            </div>
        </div>
    </div>

    <div class="form-group row">
        <label for="fechaDuelo" class="col-form-label col-sm-2" >Fecha Duelo:</label>
        <div class="col-sm-6">
          <input type="date"class="form-control" [(ngModel)]="duelo.fechaDuelo" name="fechaDuelo" required #fechaDuelo="ngModel" >
          <div class="alert alert-danger" *ngIf="fechaDuelo.invalid && (fechaDuelo.dirty || fechaDuelo.touched)" >
            <div *ngIf="fechaDuelo.errors.required">
              Fecha de duelo es requerido.
            </div>
          </div>
        </div>
    </div>
    <div class="form-group row">
        <label for="lugarDuelo" class="col-form-label col-sm-2" >Lugar Duelo:</label>
        <div class="col-sm-6">
          <input type="text"class="form-control" [(ngModel)]="duelo.lugarDuelo" name="lugarDuelo" required #lugarDuelo="ngModel" >
          <div class="alert alert-danger" *ngIf="lugarDuelo.invalid && (lugarDuelo.dirty || lugarDuelo.touched)" >
            <div *ngIf="lugarDuelo.errors.required">
              Lugar de duelo requerido.
            </div>
          </div>
        </div>
    </div>

    <div class="form-group row">
      <label for="estado" class="col-form-label col-sm-2" >Estado:</label>
      <div class="col-sm-6">
        <input type="text"class="form-control" [(ngModel)]="duelo.estado" name="estado" required #estado="ngModel" >
        <div class="alert alert-danger" *ngIf="estado.invalid && (estado.dirty || estado.touched)" >
          <div *ngIf="estado.errors.required">
           Estado de duelo es requerido.
          </div>
        </div>
      </div>
  </div>

    <div class="form-group row">
        <label for="fecha" class="col-form-label col-sm-2" >Fecha Evento:</label>
        <div class="col-sm-6">
            <select [compareWith]="compararFecha" class="form-control" [(ngModel)]="duelo.fecha" name="fecha" required #fecha="ngModel" >
              <option [ngValue]="undefined">--Seleccionar Fecha Evento--</option>
              <option *ngFor="let fecha of fechas" [ngValue]="fecha">{{fecha.nombreFecha}}</option>
            </select>
            <div class="alert alert-danger" *ngIf="fecha.invalid && (fecha.dirty || fecha.touched)" >
              <div *ngIf="fecha.errors.required">
                Fecha de evento es requerido.
              </div>
            </div>
        </div>
      </div>
-->

    <div class="form-group row">
      <div class="col-sm-6">
        <button type="button" [disabled]="!form.form.valid"  class="btn btn-primary mr-3"  name="button" (click)="create()" *ngIf="!duelo.idDuelo else elseBlock" >Crear</button>  
      <ng-template #elseBlock>
        <button type="button"[disabled]="!form.form.valid"   class="btn btn-primary mr-3"  name="button" (click)="update()"  >Actualizar</button>  
      </ng-template>
      <button type="button" (click)="cancelar()"  class="btn btn-danger"  name="button"  >Cancelar</button>  
      </div>
    </div> 
  </form>  
</div>
</div>
