<div class="container-fluid">
    <div class="card border-primary mb-3" style="max-width: 80%; margin: auto;">
      <div class="card-header text-center font-weight-bold">COMUNICADOS</div>
      <div class="card-body">
        <div class="d-flex justify-content-between mb-3">
          <button type="button" [routerLink]="['/comunicados/form']" class="btn btn-primary">
            Crear Comunicado
          </button>
          <div class="input-group w-50">
            <input type="text" class="form-control" placeholder="Buscar por título..." [(ngModel)]="searchTerm" (input)="search()">
          </div>
        </div>
  
        <div *ngIf="comunicados?.length == 0" class="alert alert-info text-center">
          No hay registros en la base de datos!
        </div>
  
        <div class="row" *ngIf="comunicados?.length > 0">
          <div class="col-md-4 mb-3" *ngFor="let comunicado of paginatedComunicados">
            <div class="card shadow-sm">
              <div class="card-body">
                <h5 class="card-title d-block text-center font-weight-bold">{{comunicado.titulo}}</h5>

                <p class="card-text text-truncate">{{comunicado.descripcion}}</p>
                <p class="text-muted"><small>Publicado: {{comunicado.fechaPublicacion}}</small></p>
                <span class="badge" [ngClass]="{'badge-success': comunicado.estadoComunicado, 'badge-secondary': !comunicado.estadoComunicado}">
                  {{comunicado.estadoComunicado ? 'Activo' : 'Inactivo'}}
                </span>
                <div class="mt-2 d-flex justify-content-between">
                  <button type="button" class="btn btn-sm btn-info" (click)="openModal(comunicado)">
                    Ver más
                  </button>
                  <button type="button" [routerLink]="['/comunicados/form', comunicado.idComunicado]" class="btn btn-sm btn-primary" title="Editar comunicado">
                    <i class="fas fa-edit"></i>
                  </button>
                  <button type="button" (click)="delete(comunicado)" class="btn btn-sm btn-danger" title="Eliminar comunicado">
                    <i class="fas fa-trash-alt"></i>
                  </button>
                  
                </div>
              </div>
            </div>
          </div>
        </div>
  
        <nav *ngIf="comunicados?.length > 0" aria-label="Page navigation example">
          <ul class="pagination justify-content-center mt-3">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage - 1)" aria-label="Previous">
                <span aria-hidden="true">&laquo;</span>
              </a>
            </li>
            <li class="page-item" *ngFor="let page of [].constructor(ceil(comunicados.length / itemsPerPage)); let i = index" [class.active]="currentPage === i + 1">
              <a class="page-link" href="javascript:void(0);" (click)="changePage(i + 1)">{{ i + 1 }}</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === ceil(comunicados.length / itemsPerPage)">
              <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage + 1)" aria-label="Next">
                <span aria-hidden="true">&raquo;</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
