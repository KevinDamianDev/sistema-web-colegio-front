<br>
<div class="container-fluid">
  <div class="card border-primary mb-3" style="max-width: 80%; margin: auto;">
    <div class="card-header text-center font-weight-bold">DOCENTES</div>
    <div class="card-body">
      <div class="table-responsive w-100">
        <div *ngIf="personas?.length==0" class="alert alert-info">
          No hay registros en la base de datos!
        </div>

        <div class="row" *ngIf="personas?.length > 0">
          <div class="col-md-6">
            <div class="input-group mb-3">
              <input type="text" class="form-control" placeholder="Buscar por DNI..." [(ngModel)]="searchTerm" (input)="search()">
            </div>
          </div>
        </div>

        <table class="table table-striped table-bordered w-100" *ngIf="personas?.length > 0">
          <thead class="thead-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Apellidos</th>
              <th>DNI</th>
              <th>Teléfono</th>
              <th>Correo</th>
              <th>#</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let docente of paginatedPersonas">
              <td>{{docente.idPersona}}</td>
              <td>{{docente.nombrePersona}}</td>
              <td>{{docente.apellidosPersonas}}</td>
              <td>{{docente.dniPersona}}</td>
              <td>{{docente.telefonoPersona}}</td>
              <td>{{docente.correoPersona}}</td>
              <td>
                <button type="button" class="btn btn-primary" title="Detalle" (click)="openModal(docente.idPersona)">
                  <i class="fas fa-edit"></i>
                </button>
                         
              </td>
            </tr>
          </tbody>
        </table>

<!-- Modal -->
<div class="modal fade" id="periodoModal" tabindex="-1" aria-labelledby="periodoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="periodoModalLabel">Selecciona un período</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar" (click)="closeModal()"></button>
      </div>
      <div class="modal-body text-center">
        <ul class="list-group">
          <li class="list-group-item list-group-item-action" *ngFor="let periodo of periodos" (click)="seleccionarPeriodo(periodo)">
            {{ periodo.nombrePeriodo }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>




      </div>
    </div>
  </div>
</div>
