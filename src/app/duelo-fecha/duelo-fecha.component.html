
<div class="container">
    <div class="row">

        <div class="col-md-12">
          <hr style="border-top: 2px solid #000000; margin: 10px 0;">
          <div class="d-flex align-items-center">
            <i class="fa fa-arrow-left" [routerLink]="['/detalle/eventoFecha',idFase]" style="cursor: pointer;"></i>
            <h5 style="font-size: 15px; margin-left: 20px;">Detalle del evento</h5>
          </div>
          <hr style="border-top: 2px solid #000000; margin: 5px 0;">
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <div class="alert alert-primary" style="text-align: center; display: flex; justify-content: center; align-items: center;">
              {{nombreFecha}}
            </div>
        </div>
      </div>
</div>

<div class="container">
  <div class="card  border-primary  mb-3">
    <div class="card-header">DUELOS</div>
    <div class="card-body text-success" >

         
            <div class="my-2 text-left">
              <input type="checkbox" [(ngModel)]="checkboxSeleccionado" (change)="toggleBotones()"> Opciones
            </div>
            <br>
            <div *ngIf="botonesHabilitados">
              <button type="button" [routerLink]="['/duelos/form',{ idFecha: idFecha }]" 
              class="btn btn-rounded btn-primary">Crear Duelo</button>
            </div>
          <br *ngIf="botonesHabilitados">
          <div *ngIf="!errorDuelos">
            <table class="table table-striped table-bordered">
              <thead>
                    <tr>
                      <th class="text-center">Nombre duelo</th>
                      <th class="text-center">Fecha</th>
                      <th class="text-center">Lugar</th>
                      <th class="text-center">Estado</th>
                      <th class="text-center" *ngIf="botonesHabilitados">#</th>
                    </tr>
              </thead>
              <tbody>
                    <tr *ngFor="let duelo of duelos">
                      <td class="text-center">{{ duelo.nombreDuelo }}</td>
                      <td class="text-center">{{ duelo.fechaDuelo }}</td>
                      <td class="text-center">{{ duelo.lugarDuelo }}</td>
                      <td class="text-center">{{ duelo.estado }}</td>
                      <td  class="text-center" *ngIf="botonesHabilitados">
                        <button type="button" name="editar" [routerLink]="['/duelos/form',duelo.idDuelo,{ idFecha: idFecha }]"   class="btn btn-primary" >
                          <i class="fas fa-edit"></i>
                      </button>
                        <button type="button" name="eliminar" (click)="delete(duelo)"   class="btn btn-danger" >
                          <i class="fas fa-trash-alt"></i>
                        </button>
                      </td>
                    </tr>
                </tbody>
              </table>    
            </div>
  
      <div *ngIf="errorDuelos">
        <div class="alert alert-info">     
            {{errorDuelos}}
          </div>
      </div>
        </div>
    </div>
</div>
