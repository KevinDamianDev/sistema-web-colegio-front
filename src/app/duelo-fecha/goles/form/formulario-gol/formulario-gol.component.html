
  
  <div class="card bg-secondary  text-white"  >
    <div class="card-header"> {{titulo}} - {{nombreEquipo}}  </div>
      <div class="card-body">
  
  <form #form="ngForm"> 
    <div class="form-group row">
      <label for="minutoGol" class="col-form-label col-sm-2" >Minuto de marcador:</label>
        <div class="col-sm-6">
            <input type="number"class="form-control" [(ngModel)]="goles.minutoGol" name="nombreEvento" required #minutoGol="ngModel">
            <div class="alert alert-danger" *ngIf="minutoGol.invalid && (minutoGol.dirty || minutoGol.touched)" >
              <div *ngIf="minutoGol.errors.required">
                  Minuto de marcador es requerido.
              </div>
            </div>
        </div>
    </div>
    

    <div class="form-group row">
        <label for="equipoJugador" class="col-form-label col-sm-2" >Jugador:</label>
        <div class="col-sm-6">
            <select [compareWith]="compararEquipoJugador" class="form-control" [(ngModel)]="goles.equipoJugador" name="equipoJugador" required #equipoJugador="ngModel" >
              <option [ngValue]="undefined">--Seleccionar Jugador--</option>
              <option *ngFor="let jugador of equipoJugadores" [ngValue]="jugador">{{jugador.jugador.nombreJugador}}</option>
            </select>
            <div class="alert alert-danger" *ngIf="equipoJugador.invalid && (equipoJugador.dirty || equipoJugador.touched)" >
              <div *ngIf="equipoJugador.errors.required">
                 Jugador es requerido.
              </div>
            </div>
        </div>
      </div>

    <div class="form-group row">
      <div class="col-sm-6">
        <button role="button" [disabled]="!form.form.valid"  class="btn btn-primary mr-3"  name="button" (click)="create()" *ngIf="!goles.idGol else elseBlock">Crear</button>  
      <ng-template #elseBlock>
        <button role="button"[disabled]="!form.form.valid"   class="btn btn-primary mr-3"  name="button" (click)="update()"  >Actualizar</button>  
      </ng-template>
      
      </div>
    </div> 
  </form>  
  <div >
  <button type="button" (click)="regresar()"  class="btn btn-danger"  name="button"  >Cancelar</button>  
  </div>
</div>
</div>
