
<br>
<div class="container">
    <div class="row">
      <div class="col-md-12">
        <div  class="alert alert-primary"
          style="text-align: center; display: flex; justify-content: center; align-items: center;">
          {{nombreDuelo}}
        </div>
      </div>
    </div>
  </div>


  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div style="text-align: center;">
            <ng-container *ngFor="let equipoGrupoDuelo of equipoGrupoDuelos; let i = index">

              <div style="display: inline-block; margin: 0 10px;">



                <img *ngIf="equipoGrupoDuelo.equipoGrupo.equipo?.foto" src="http://localhost:8080/equipos/uploads/img/{{equipoGrupoDuelo.equipoGrupo.equipo.foto}}" class="card-img-top img-thumbnail rounded" style="width: 150px; height: 150px;">
                <img *ngIf="!equipoGrupoDuelo.equipoGrupo.equipo?.foto" src="http://localhost:8080/images/no_equipo.png" alt="Sin foto" class="card-img-top img-thumbnail rounded" style="width: 150px; height: 150px;">
                <p style="white-space: nowrap;  font-size: 20px">{{ equipoGrupoDuelo.equipoGrupo.equipo.nombreEquipo }}</p>
                <br>
                <div>
                    <button type="button" class="btn btn-rounded btn-primary"
                      [routerLink]="['/gol/form',{idDuelo: idDuelo, idEquipo: equipoGrupoDuelo.equipoGrupo.equipo.idEquipo }]" 
                      title="Añadir marcador">Añadir Marcador
                    </button>
                </div>
                  <br>
              </div>
              <ng-container *ngIf="i < equipoGrupoDuelos.length - 1">
                <p class="vs-label">VS</p>
              </ng-container>
            </ng-container>
          </div>
          


              <div class="container">
                  <div class="row">
                    <div class="col-md-6" *ngFor="let equipo of agruparGolesPorEquipo() | keyvalue"> 
                      <div class="card mb-2">
                        <div class="card-body">
                          <p class="text-center" style="font-size: 30px;">{{ equipo.value.cantidadGoles }}</p>
                        </div>
                      </div>
                
                      <ng-container *ngIf="equipo.value.goles.length > 0">
                        <div class="text-center"  style="font-size: 15px; margin-top: 10px;" 
                         *ngFor="let gol of equipo.value.goles">

                         Minuto: {{ gol.minutoGol }}, Jugador: {{ gol.nombreJugador }}
                        <br>
                          <div style="margin-top: 10px;" >
                            <button type="button" name="editar" title="Editar marcador"  class="btn btn-success"
                            [routerLink]="['/gol/form',gol.idGol, {idDuelo: idDuelo, idEquipo: gol.idEquipo }]"style="margin-right: 10px;">
                            <i class="fas fa-edit"></i>
                          </button>
                          <button type="button" name="eliminar" title="Eliminar marcador" (click)="delete(gol)"
                            class="btn btn-danger"  style="margin-right: 10px;">
                            <i class="fas fa-trash-alt"></i>
                          </button>                                          
                        </div>
                    </div>
                      </ng-container>
                
                      <ng-container *ngIf="equipo.value.goles.length === 0">
                        <p>No hay marcadores</p>
                      </ng-container>
                    </div>
                  </div>
                </div>


      </div>
    </div>
  </div>
