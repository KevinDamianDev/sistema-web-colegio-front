
<div class="abrir-modal" *ngIf="modalService.modal">
<div  class="modal" style="display: block;" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <br>
      <div class="modal-header">
        <h5 class="modal-title">{{titulo}}</h5>
        <button (click)="cerrarModal()" type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="container">
          <div class="row">
            <div *ngIf="equipo" class="input-group mb-3 ">
              <input  (change)="seleccionarFoto($event)" type="file" class="form-control" id="inputGroupFile04" aria-describedby="inputGroupFileAddon04" aria-label="Upload">
              <button [disabled]="!fotoS" (click)="subirFoto()" class="btn btn-primary" type="button" id="inputGroupFileAddon04">GUARDAR</button>
            </div>
  
            <div *ngIf="equipo" class="col-sm text-center">
              <img *ngIf="equipo?.foto" src="http://localhost:8080/equipos/uploads/img/{{equipo.foto}}" alt="{{equipo.foto}}" class="img-thumbnail rounded" width="250px" height="auto">
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button"  (click)="cerrarModal()" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
</div>
