
  <!---->
  <div class="card bg-secondary  text-white"  >
    <div class="card-header"> {{titulo}} -- {{nombreEvento}} </div>
      <div class="card-body">
  
  <form #form="ngForm">
  
    <div class="form-group row">
      <label for="nombreEquipo" class="col-form-label col-sm-2" >Nombre equipo:</label>
        <div class="col-sm-6">
            <input type="text"class="form-control" [(ngModel)]="equipo.nombreEquipo" name="nombreEquipo" required minlength="3" maxlength="40" #nombre="ngModel">
            <div class="alert alert-danger" *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" >
              <div *ngIf="nombre.errors.required">
                  Nombre equipo es requerido.
              </div>
              <div *ngIf="nombre.errors.minlength">
                  Nombre equipo debe tener al menos 3 caracteres.
              </div>
              <div *ngIf="nombre.errors.maxlength">
                Nombre equipo no debe ser más de 40 caracteres.
            </div>
            </div>
        </div>
    </div>
    <div class="form-group row">
      <div class="col-sm-6">
        <button role="button" [disabled]="!form.form.valid"  class="btn btn-primary mr-3"  name="button" (click)="create()" *ngIf="!equipo.idEquipo else elseBlock" >Crear</button> 
         
      <ng-template #elseBlock>
        <button role="button"[disabled]="!form.form.valid"   class="btn btn-primary mr-3"  name="button" (click)="update()"  >Actualizar</button>  
      </ng-template>
      <button role="button" (click)="cancelar()" class="btn btn-danger"  name="button"  >Cancelar</button>  
      </div>
    </div>
  
  </form>
  
      </div>
  </div>
