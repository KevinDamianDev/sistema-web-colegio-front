<br>
<div class="container-fluid">
  <div class="card border-primary mb-3" style="max-width: 80%; margin: auto;">
    <div class="card-header text-center font-weight-bold">ALUMNOS</div>
    <div class="card-body">

      <div class="table-responsive w-100" >
        <div *ngIf="personas?.length==0" class="alert alert-info">
          No hay registros en la base de datos!
        </div>
        <!-- Agregar esto encima de la tabla -->
        <div class="row" *ngIf="personas?.length > 0">
          <div class="col-md-6">
            <div class="input-group mb-3">
              <input type="text" class="form-control" placeholder="Buscar por DNI..." [(ngModel)]="searchTerm" (input)="search()">
            </div>
            
          </div>
        </div>
        

        <table class="table table-striped table-bordered w-100" *ngIf="personas?.length > 0">
          <thead class="thead-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Apellidos</th>
              <th>DNI</th>
              <th>Teléfono</th>
              <th>Correo</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let alumno of paginatedPersonas">
              <td>{{alumno.idPersona}}</td>
              <td>{{alumno.nombrePersona}}</td>
              <td>{{alumno.apellidosPersonas}}</td>
              <td>{{alumno.dniPersona}}</td>
              <td>{{alumno.telefonoPersona}}</td>
              <td>{{alumno.correoPersona}}</td>
            </tr>
          </tbody>
        </table>


          <nav aria-label="Page navigation example">
            <ul class="pagination justify-content-center">
              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage - 1)" aria-label="Previous">
                  <span aria-hidden="true">&laquo;</span>
                </a>
              </li>
              <li class="page-item" *ngFor="let page of [].constructor(ceil(personas.length / itemsPerPage)); let i = index" [class.active]="currentPage === i + 1">
                <a class="page-link" href="javascript:void(0);" (click)="changePage(i + 1)">{{ i + 1 }}</a>
              </li>
              <li class="page-item" [class.disabled]="currentPage === ceil(personas.length / itemsPerPage)">
                <a class="page-link" href="javascript:void(0);" (click)="changePage(currentPage + 1)" aria-label="Next">
                  <span aria-hidden="true">&raquo;</span>
                </a>
              </li>
            </ul>
          </nav>


  </div>

</div>
</div> 
</div>
